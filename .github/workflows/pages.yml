name: Site

env:
  ASTRO_TELEMETRY_DISABLED: "1"

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck, build, translate, and check the output
        run: npm run verify
        env:
          # The repository secret is named ANTHROPIC_TRANSLATION; the SDK reads it as
          # ANTHROPIC_API_KEY. GitHub masks it as *** in the log when present.
          # Only a push to master may spend on translation; pull requests build from the cache.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_TRANSLATION }}
          TRANSLATE_SPEND: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: Commit new translations to the cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet -- translations && [ -z "$(git ls-files --others --exclude-standard translations)" ]; then
            echo "No new translations."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations
          git commit -m "Add translations for new content"
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
