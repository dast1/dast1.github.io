name: Translations

# Translates every fragment the cache does not already hold and opens a pull
# request with the updated translations/*.json files. Run it after adding or
# editing content; the Site build then serves from the cache without an API call.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build and translate
        run: npm run translate
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Open a pull request with the updated cache
        uses: peter-evans/create-pull-request@v7
        with:
          branch: translations/update
          commit-message: Update translations
          title: Update translations
          body: |
            Generated by the Translations workflow. Review any entry that reads
            wrong and edit its `t` value in `translations/<lang>.json`.
          add-paths: translations/*.json
          delete-branch: true
